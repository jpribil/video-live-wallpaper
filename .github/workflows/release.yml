name: Release

# Builds a signed release APK and publishes it as a GitHub Release.
#
# How to release (see docs/RELEASING.md):
#   1. bump versionCode/versionName in app/build.gradle.kts and add
#      fastlane/metadata/android/{en-US,cs-CZ}/changelogs/<versionCode>.txt
#   2. commit, then: git tag v<versionName> && git push origin v<versionName>
#
# "Run workflow" by hand does a dry run: same build and checks, but the APK is
# only attached to the run as an artifact and no release is created.
#
# Signing secrets (repository Settings → Secrets and variables → Actions):
#   VLW_KEYSTORE_BASE64, VLW_STORE_PASSWORD, VLW_KEY_ALIAS, VLW_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate. The build fails if the APK
  # is signed with anything else, so a wrong or replaced secret can never
  # publish an APK that installed copies refuse to update to.
  EXPECTED_CERT_SHA256: 8c9ae5fa883cfff543f7a1446f6bb2b4f5f576914c4fa423a5e5dde636fdc15e

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          name=$(tr -d '\r' < app/build.gradle.kts | sed -n 's/^ *versionName = "\(.*\)"/\1/p')
          code=$(tr -d '\r' < app/build.gradle.kts | sed -n 's/^ *versionCode = \([0-9]*\)/\1/p')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name (expected v$name)"
            exit 1
          fi
          for lang in en-US cs-CZ; do
            f="fastlane/metadata/android/$lang/changelogs/$code.txt"
            [ -s "$f" ] || { echo "::error::Missing changelog $f"; exit 1; }
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VLW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set (VLW_KEYSTORE_BASE64 …)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          ORG_GRADLE_PROJECT_vlwStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_vlwStorePassword: ${{ secrets.VLW_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_vlwKeyAlias: ${{ secrets.VLW_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_vlwKeyPassword: ${{ secrets.VLW_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature
        id: apk
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt)
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with $actual, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          out="video-live-wallpaper-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          code=${{ steps.version.outputs.code }}
          {
            cat "fastlane/metadata/android/en-US/changelogs/$code.txt"
            echo
            echo "**Česky:** $(cat "fastlane/metadata/android/cs-CZ/changelogs/$code.txt")"
            echo
            echo "---"
            echo "Requires Android 8.0 or newer. Application ID \`cz.pribil.videowallpaper\` (installs next to the original app)."
            echo
            echo "Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
          } > notes.md
          cat notes.md

      - name: Dry run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
            notes.md
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
